name: Build Windows MSIX

on:
  push:
    branches: [ main ]
    tags:
      - 'v*.*.*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  DOTNET_VERSION: '10.0.x'
  PROJECT_PATH: 'Sudoku.Maui/Sudoku.Maui.csproj'
  CONFIGURATION: 'Release'
  PLATFORM: 'x64'

jobs:
  build-windows:
    runs-on: windows-latest
    
    # Required for creating releases on tag push
    permissions:
      contents: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Install .NET MAUI workload (Windows only)
      run: dotnet workload install maui-windows --skip-manifest-update

    - name: Restore dependencies
      run: dotnet restore ${{ env.PROJECT_PATH }}

    - name: Get version from project
      id: version
      shell: pwsh
      run: |
        [xml]$proj = Get-Content ${{ env.PROJECT_PATH }}
        $version = $proj.Project.PropertyGroup.ApplicationDisplayVersion | Select-Object -First 1
        if ([string]::IsNullOrEmpty($version)) { $version = "1.0.0" }
        echo "VERSION=$version" >> $env:GITHUB_OUTPUT
        echo "Building version: $version"

    - name: Create self-signed certificate
      shell: pwsh
      run: |
        $cert = New-SelfSignedCertificate `
          -Type Custom `
          -Subject "CN=jtmunn" `
          -KeyUsage DigitalSignature `
          -FriendlyName "Sudoku App Certificate" `
          -CertStoreLocation "Cert:\CurrentUser\My" `
          -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3", "2.5.29.19={text}")
        
        $password = ConvertTo-SecureString -String "temp123" -Force -AsPlainText
        Export-PfxCertificate -Cert "Cert:\CurrentUser\My\$($cert.Thumbprint)" -FilePath "SudokuCert.pfx" -Password $password
        Export-Certificate -Cert "Cert:\CurrentUser\My\$($cert.Thumbprint)" -FilePath "SudokuCert.cer"
        
        echo "CERT_THUMBPRINT=$($cert.Thumbprint)" >> $env:GITHUB_OUTPUT
        Write-Host "Certificate created with thumbprint: $($cert.Thumbprint)"

    - name: Build MSIX package
      shell: pwsh
      run: |
        dotnet publish ${{ env.PROJECT_PATH }} `
          -f net10.0-windows10.0.19041.0 `
          -c ${{ env.CONFIGURATION }} `
          -p:RuntimeIdentifierOverride=win-x64 `
          -p:WindowsPackageType=MSIX `
          -p:WindowsAppSDKSelfContained=true `
          -p:GenerateAppxPackageOnBuild=true `
          -p:AppxPackageSigningEnabled=false

    - name: Find and sign MSIX package
      id: find_msix
      shell: pwsh
      run: |
        $msixPath = Get-ChildItem -Path "Sudoku.Maui/bin" -Recurse -Filter "*.msix" | 
                    Where-Object { 
                        $_.FullName -notmatch 'Dependencies' -and 
                        $_.FullName -match 'AppPackages' 
                    } | 
                    Select-Object -First 1 -ExpandProperty FullName
        
        if ([string]::IsNullOrEmpty($msixPath)) {
          Write-Error "MSIX package not found in Sudoku.Maui/bin/AppPackages!"
          Write-Host "Searching for all MSIX files for debugging:"
          Get-ChildItem -Path "Sudoku.Maui/bin" -Recurse -Filter "*.msix" | ForEach-Object { Write-Host "  Found: $($_.FullName)" }
          exit 1
        }
        
        Write-Host "Found MSIX: $msixPath"
        
        # Sign the MSIX with SignTool
        $signtool = "C:\Program Files (x86)\Windows Kits\10\bin\10.0.22621.0\x64\signtool.exe"
        Write-Host "Signing MSIX with certificate..."
        & $signtool sign /fd SHA256 /a /f "SudokuCert.pfx" /p "temp123" $msixPath
        
        if ($LASTEXITCODE -ne 0) {
          Write-Error "Failed to sign MSIX package"
          exit 1
        }
        
        Write-Host "MSIX signed successfully"
        
        # Copy to workspace root with clean name
        $cleanFileName = "Sudoku_${{ steps.version.outputs.VERSION }}_Windows_x64.msix"
        Copy-Item -Path $msixPath -Destination $cleanFileName -Force
        
        Write-Host "Copied to: $cleanFileName"
        Write-Host "File exists: $(Test-Path $cleanFileName)"
        
        echo "MSIX_PATH=$cleanFileName" >> $env:GITHUB_OUTPUT
        echo "MSIX_FILENAME=$cleanFileName" >> $env:GITHUB_OUTPUT

    - name: Upload MSIX artifact
      uses: actions/upload-artifact@v4
      with:
        name: windows-msix
        path: |
          ${{ steps.find_msix.outputs.MSIX_PATH }}
          SudokuCert.cer
        retention-days: 30

    - name: Create Release (on tag push)
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v1
      with:
        files: |
          ${{ steps.find_msix.outputs.MSIX_PATH }}
          SudokuCert.cer
        draft: false
        prerelease: false
        generate_release_notes: true
        name: Release ${{ steps.version.outputs.VERSION }}
        body: |
          ## Installation Instructions
          
          1. Download both `Sudoku_${{ steps.version.outputs.VERSION }}_Windows_x64.msix` and `SudokuCert.cer`
          2. **Right-click** `SudokuCert.cer` ? **Install Certificate**
          3. Choose **Local Machine** ? **Next** (requires admin)
          4. Select **"Place all certificates in the following store"** ? **Browse** ? **Trusted People** ? **OK**
          5. Click **Next** ? **Finish**
          6. **Double-click** the `.msix` file to install
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

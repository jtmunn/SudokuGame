name: Build Windows MSIX

on:
  push:
    branches: [ main ]
    tags:
      - 'v*.*.*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  DOTNET_VERSION: '10.0.x'
  PROJECT_PATH: 'Sudoku.Maui/Sudoku.Maui.csproj'
  CONFIGURATION: 'Release'
  PLATFORM: 'x64'

jobs:
  build-windows:
    runs-on: windows-latest
    
    # Required for creating releases on tag push
    permissions:
      contents: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotenv@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Install .NET MAUI workload (Windows only)
      run: dotnet workload install maui-windows --skip-manifest-update

    - name: Restore dependencies
      run: dotnet restore ${{ env.PROJECT_PATH }}

    - name: Get version from project
      id: version
      shell: pwsh
      run: |
        [xml]$proj = Get-Content ${{ env.PROJECT_PATH }}
        $version = $proj.Project.PropertyGroup.ApplicationDisplayVersion | Select-Object -First 1
        if ([string]::IsNullOrEmpty($version)) { $version = "1.0.0" }
        echo "VERSION=$version" >> $env:GITHUB_OUTPUT
        echo "Building version: $version"

    - name: Build MSIX package
      run: |
        dotnet publish ${{ env.PROJECT_PATH }} `
          -f net10.0-windows10.0.19041.0 `
          -c ${{ env.CONFIGURATION }} `
          -p:RuntimeIdentifierOverride=win-x64 `
          -p:WindowsPackageType=MSIX `
          -p:WindowsAppSDKSelfContained=true `
          -p:GenerateAppxPackageOnBuild=true `
          -p:AppxPackageSigningEnabled=false

    - name: Find MSIX package
      id: find_msix
      shell: pwsh
      run: |
        $msixPath = Get-ChildItem -Path "Sudoku.Maui/bin" -Recurse -Filter "*.msix" | 
                    Where-Object { 
                        $_.FullName -notmatch 'Dependencies' -and 
                        $_.FullName -match 'AppPackages' 
                    } | 
                    Select-Object -First 1 -ExpandProperty FullName
        
        if ([string]::IsNullOrEmpty($msixPath)) {
          Write-Error "MSIX package not found in Sudoku.Maui/bin/AppPackages!"
          Write-Host "Searching for all MSIX files for debugging:"
          Get-ChildItem -Path "Sudoku.Maui/bin" -Recurse -Filter "*.msix" | ForEach-Object { Write-Host "  Found: $($_.FullName)" }
          exit 1
        }
        
        echo "MSIX_PATH=$msixPath" >> $env:GITHUB_OUTPUT
        echo "Found MSIX: $msixPath"
        
        $fileName = "Sudoku_${{ steps.version.outputs.VERSION }}_x64.msix"
        echo "MSIX_FILENAME=$fileName" >> $env:GITHUB_OUTPUT

    - name: Upload MSIX artifact
      uses: actions/upload-artifact@v4
      with:
        name: windows-msix
        path: ${{ steps.find_msix.outputs.MSIX_PATH }}
        retention-days: 30

    - name: Create Release (on tag push)
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v1
      with:
        files: ${{ steps.find_msix.outputs.MSIX_PATH }}
        draft: false
        prerelease: false
        generate_release_notes: true
        name: Release ${{ steps.version.outputs.VERSION }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

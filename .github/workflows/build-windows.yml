name: Build Windows Portable

on:
  push:
    branches: [ main ]
    tags:
      - 'v*.*.*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  DOTNET_VERSION: '10.0.x'
  PROJECT_PATH: 'Sudoku.Maui/Sudoku.Maui.csproj'
  CONFIGURATION: 'Release'
  PLATFORM: 'x64'

jobs:
  build-windows:
    runs-on: windows-latest
    
    permissions:
      contents: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Install .NET MAUI workload (Windows only)
      run: dotnet workload install maui-windows --skip-manifest-update

    - name: Restore dependencies
      run: dotnet restore ${{ env.PROJECT_PATH }}

    - name: Get version from project
      id: version
      shell: pwsh
      run: |
        [xml]$proj = Get-Content ${{ env.PROJECT_PATH }}
        $version = $proj.Project.PropertyGroup.ApplicationDisplayVersion | Select-Object -First 1
        if ([string]::IsNullOrEmpty($version)) { $version = "1.0.0" }
        echo "VERSION=$version" >> $env:GITHUB_OUTPUT
        echo "Building version: $version"

    - name: Publish Windows unpackaged
      shell: pwsh
      run: |
        dotnet publish ${{ env.PROJECT_PATH }} `
          -f net10.0-windows10.0.19041.0 `
          -c ${{ env.CONFIGURATION }} `
          -r win-x64 `
          --self-contained true `
          -p:PublishSingleFile=false `
          -p:WindowsPackageType=None `
          -p:WindowsAppSDKSelfContained=true

    - name: Create portable ZIP
      id: create_zip
      shell: pwsh
      run: |
        $publishDir = "Sudoku.Maui\bin\x64\Release\net10.0-windows10.0.19041.0\win-x64\publish"
        $zipName = "Sudoku_${{ steps.version.outputs.VERSION }}_Windows_x64_Portable.zip"
        
        Write-Host "Creating ZIP from: $publishDir"
        Compress-Archive -Path "$publishDir\*" -DestinationPath $zipName -Force
        
        Write-Host "Created: $zipName"
        Write-Host "File size: $((Get-Item $zipName).Length / 1MB) MB"
        
        echo "ZIP_PATH=$zipName" >> $env:GITHUB_OUTPUT

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: windows-portable
        path: ${{ steps.create_zip.outputs.ZIP_PATH }}
        retention-days: 30

    - name: Create Release (on tag push)
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v1
      with:
        files: ${{ steps.create_zip.outputs.ZIP_PATH }}
        draft: false
        prerelease: false
        generate_release_notes: true
        name: Release ${{ steps.version.outputs.VERSION }}
        body: |
          ## Installation Instructions
          
          1. Download `Sudoku_${{ steps.version.outputs.VERSION }}_Windows_x64_Portable.zip`
          2. Extract the ZIP file to a folder (e.g., `C:\Program Files\Sudoku\`)
          3. Run `Sudoku.Maui.exe`
          
          **No installation required!** Just extract and run.
          
          To create a desktop shortcut, right-click `Sudoku.Maui.exe` > Send to > Desktop (create shortcut)
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
